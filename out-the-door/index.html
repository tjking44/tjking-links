<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJ King — Out The Door</title>
<meta name="description" content="Stream Out The Door by TJ King, produced with Onbin.">
<meta property="og:title" content="TJ King — Out The Door">
<meta property="og:description" content="Stream Out The Door, produced with Onbin.">
<meta property="og:image" content="https://kingbiz.egnyte.com/dd/GTbxdrkyq9Hh">
<style>
  :root {
    --bg: #1A0A02;
    --panel: #24100A;
    --cream: #E8D6B0;
    --gold: #F0B43C;
    --brown: #481800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Instrument Sans", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  img.cover {
    width: 60%;
    max-width: 240px;
    border-radius: 16px;
    border: 2px solid var(--gold);
    margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 4px;
    color: #FFFFFF;
    letter-spacing: -0.01em;
  }
  p.byline {
    margin: 0 0 32px;
    color: var(--cream);
    opacity: 0.85;
    font-size: 15px;
  }
  a.btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 14px;
    border-radius: 24px;
    background: var(--gold);
    color: var(--bg);
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    box-shadow: 0 4px 14px rgba(240,180,60,0.0);
    -webkit-tap-highlight-color: transparent;
  }
  a.btn:hover {
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 10px 24px rgba(240,180,60,0.35);
    background: #FCCC6C;
  }
  a.btn:active {
    transform: translateY(0) scale(0.97);
    box-shadow: 0 4px 10px rgba(240,180,60,0.25);
    transition: transform 0.08s ease;
  }
  a.btn.secondary {
    background: transparent;
    color: var(--gold);
    border: 2px solid var(--gold);
  }
  a.btn.secondary:hover {
    background: rgba(240,180,60,0.08);
    box-shadow: 0 10px 24px rgba(240,180,60,0.18);
  }
  hr {
    border: none;
    border-top: 1px solid var(--brown);
    margin: 36px 0 28px;
    width: 60px;
  }
  h3.eyebrow {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 8px;
    font-weight: 700;
  }
  p.offer {
    font-size: 15px;
    line-height: 1.5;
    color: var(--cream);
    opacity: 0.9;
    margin: 0 0 20px;
  }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--cream);
    opacity: 0.4;
  }

  /* Entrance animation — staggered, subtle, no bounce */
  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.6s ease forwards;
    }
    img.cover.reveal { animation-delay: 0.05s; }
    h1.reveal { animation-delay: 0.15s; }
    p.byline.reveal { animation-delay: 0.22s; }
    a.btn.reveal { animation-delay: 0.30s; }
    hr.reveal { animation-delay: 0.36s; }
    h3.eyebrow.reveal { animation-delay: 0.40s; }
    p.offer.reveal { animation-delay: 0.46s; }
    iframe.reveal { animation-delay: 0.52s; }
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Gentle glow pulse on the primary CTA — draws the eye once, doesn't loop forever */
  @media (prefers-reduced-motion: no-preference) {
    a.btn.primary-pulse {
      animation: rise 0.6s ease forwards, pulseglow 2.2s ease-in-out 0.9s 2;
    }
  }
  @keyframes pulseglow {
    0%, 100% { box-shadow: 0 4px 14px rgba(240,180,60,0.0); }
    50% { box-shadow: 0 6px 22px rgba(240,180,60,0.45); }
  }
</style>
</head>
<body>
<main>
  <img class="cover reveal" src="cover.jpg" alt="TJ King" width="240" height="240">
  <h1 class="reveal">OUT THE DOOR</h1>
  <p class="byline reveal">TJ King x Onbin</p>

  <a class="btn primary-pulse" href="https://distrokid.com/hyperfollow/tjkingandonbin/out-the-door?ref=release" target="_blank" rel="noopener">Stream Now</a>

  <hr class="reveal">

  <h3 class="eyebrow reveal">Get The Stems</h3>
  <p class="offer reveal">The vocal stems to Out The Door, free, straight to your inbox.<br>Remix it, sample it, do what you want with it.</p>
  <iframe class="reveal" src="https://embeds.beehiiv.com/8570031a-54af-4371-a670-5b5b9952bd49" style="width:100%;border:none;min-height:120px;border-radius:16px;" loading="lazy" title="Get the stems"></iframe>

  <footer>Fortunate Failures Music</footer>
</main>
</body>
</html>
